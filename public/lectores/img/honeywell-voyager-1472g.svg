<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 300" role="img" aria-label="Honeywell Voyager 1472g">
  <!-- Drawing (not a photo) of the Honeywell Voyager 1472g in its charging
       base, from a product shot: black body, grey front shell around the
       scan window, grey trigger, round button on top, round light on the base. -->
  <defs>
    <linearGradient id="hb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#46494e"/><stop offset=".6" stop-color="#26282c"/><stop offset="1" stop-color="#18191c"/>
    </linearGradient>
    <linearGradient id="hg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7d8186"/><stop offset="1" stop-color="#5a5e63"/>
    </linearGradient>
    <linearGradient id="hs" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1b1c1f"/><stop offset=".5" stop-color="#34363a"/><stop offset="1" stop-color="#16171a"/>
    </linearGradient>
  </defs>
  <ellipse cx="190" cy="290" rx="110" ry="8" fill="#000" opacity=".12"/>
  <!-- charging base -->
  <path d="M86 250 Q84 210 130 196 L250 190 Q296 196 296 240 L296 262 Q294 286 250 288 L130 290 Q88 290 86 262 Z" fill="url(#hb)"/>
  <ellipse cx="190" cy="198" rx="62" ry="12" fill="#151619"/>
  <circle cx="140" cy="250" r="14" fill="#9aa0a6"/><circle cx="140" cy="250" r="10" fill="#2a2c30"/>
  <!-- grip rising out of the base cup -->
  <path d="M150 140 L206 124 Q222 162 232 202 L176 210 Q168 172 150 140 Z" fill="url(#hs)"/>
  <path d="M168 188 Q190 182 216 176 Q236 172 236 196 L238 206 L172 214 Z" fill="#1d1f22"/>
  <!-- grey trigger -->
  <path d="M140 132 Q130 150 140 170 Q150 176 160 166 Q152 152 160 136 Z" fill="url(#hg)"/>
  <!-- head: black top shell -->
  <path d="M30 60 Q34 30 70 26 L196 16 Q236 14 244 46 Q250 76 232 98 Q218 114 190 118 L62 132 Q36 134 30 110 Z" fill="url(#hb)"/>
  <!-- grey front/lower shell framing the window -->
  <path d="M26 66 Q28 50 46 48 L120 44 Q140 46 146 66 L150 118 L62 130 Q32 132 28 108 Z" fill="url(#hg)"/>
  <path d="M190 118 L150 124 L146 70 Q170 64 200 72 Q226 80 232 98 Q218 114 190 118 Z" fill="url(#hg)" opacity=".85"/>
  <!-- scan window (dark recess) -->
  <path d="M30 70 Q34 60 50 60 L104 58 Q118 60 120 74 L124 112 L60 120 Q36 120 32 104 Z" fill="#202226"/>
  <path d="M40 74 L104 70" stroke="#3a3d42" stroke-width="3" stroke-linecap="round"/>
  <!-- round button on top -->
  <ellipse cx="96" cy="34" rx="22" ry="9" transform="rotate(-6 96 34)" fill="#2f3135" stroke="#4a4d52" stroke-width="1.5"/>
  <path d="M150 24 L230 30" stroke="#fff" stroke-opacity=".12" stroke-width="4" stroke-linecap="round"/>
</svg>
